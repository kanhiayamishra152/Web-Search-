<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        window['ai_edge_gallery_get_result'] = async (data) => {
            try {
                // एजेंट से सर्च कीवर्ड लें
                const jsonData = JSON.parse(data);
                const query = jsonData.query;

                // DuckDuckGo API को कॉल करें
                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json`);
                const result = await response.json();

                // जवाब खोजें
                let answer = result.AbstractText || (result.RelatedTopics && result.RelatedTopics.length > 0 ? result.RelatedTopics[0].Text : "");
                
                if (!answer) {
                    answer = "मुझे इस विषय पर DuckDuckGo से कोई सीधा जवाब नहीं मिला।";
                }

                // एजेंट को जवाब वापस भेजें
                return JSON.stringify({
                    result: `Search results for "${query}": ${answer}`
                });
            } catch (e) {
                return JSON.stringify({
                    error: `सर्च फेल हो गया: ${e.message}`
                });
            }
        };
    </script>
</body>
</html>
