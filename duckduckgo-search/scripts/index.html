<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        window['ai_edge_gallery_get_result'] = async (data) => {
            try {
                const jsonData = JSON.parse(data);
                const query = jsonData.query;

                const response = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json`);
                const result = await response.json();

                let answer = "";
                
                // 1. अगर कोई सीधा जवाब (Abstract) है, तो उसे लें (यह वैसे भी बहुत छोटा होता है)
                if (result.AbstractText) {
                    answer = result.AbstractText;
                } 
                // 2. अगर सीधा जवाब नहीं है, तो सिर्फ टॉप 3 Related Topics लें
                else if (result.RelatedTopics && result.RelatedTopics.length > 0) {
                    // .slice(0, 3) का इस्तेमाल करके हम सिर्फ शुरुआती 3 रिजल्ट ही ले रहे हैं
                    let top3 = result.RelatedTopics.slice(0, 3);
                    
                    // अब इन 3 रिजल्ट्स के टेक्स्ट को जोड़ लेते हैं
                    let combinedTopics = top3.map(topic => topic.Text).filter(text => text !== undefined);
                    answer = combinedTopics.join(" | ");
                }
                
                if (!answer || answer.trim() === "") {
                    answer = "मुझे इस विषय पर DuckDuckGo से कोई सीधा जवाब नहीं मिला।";
                }

                // एजेंट को सिर्फ चुनिंदा और छोटा जवाब वापस भेजें
                return JSON.stringify({
                    result: `Search results for "${query}": ${answer}`
                });
            } catch (e) {
                return JSON.stringify({
                    error: `सर्च फेल हो गया: ${e.message}`
                });
            }
        };
    </script>
</body>
</html>
