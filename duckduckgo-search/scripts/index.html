<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <script>
        window['ai_edge_gallery_get_result'] = async (data) => {
            try {
                const jsonData = JSON.parse(data);
                const query = jsonData.query;

                // DuckDuckGo का असली HTML सर्च URL
                const ddgUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
                
                // CORS एरर से बचने के लिए AllOrigins फ्री प्रॉक्सी का उपयोग
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(ddgUrl)}`;
                
                const response = await fetch(proxyUrl);
                const result = await response.json();
                
                // HTML कोड को पढ़ना (Web Scraping)
                const parser = new DOMParser();
                const doc = parser.parseFromString(result.contents, "text/html");
                
                // DuckDuckGo के सर्च रिजल्ट्स (Snippets) ढूँढना
                const snippets = doc.querySelectorAll('.result__snippet');
                let answer = "";
                
                if (snippets.length > 0) {
                    // टॉप 3 रिजल्ट्स लेना
                    let top3 = Array.from(snippets).slice(0, 3);
                    answer = top3.map(el => el.textContent.trim()).join(" | ");
                } else {
                    answer = "मुझे इंटरनेट पर इस विषय से जुड़ी कोई सटीक जानकारी नहीं मिली।";
                }

                return JSON.stringify({
                    result: `सर्च रिज़ल्ट "${query}": ${answer}`
                });
            } catch (e) {
                return JSON.stringify({
                    error: `सर्च फेल हो गया: ${e.message}`
                });
            }
        };
    </script>
</body>
</html>
