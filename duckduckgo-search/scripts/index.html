<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDuckGo Search Skill</title>
</head>
<body>

<script>
(function () {
    "use strict";

    const MAX_RESULTS = 3;

    async function fetchSearchResults(query) {
        const duckDuckGoUrl =
            "https://html.duckduckgo.com/html/?q=" +
            encodeURIComponent(query);

        const proxyCandidates = [
            "https://api.allorigins.win/get?url=" + encodeURIComponent(duckDuckGoUrl),
            "https://corsproxy.io/?" + encodeURIComponent(duckDuckGoUrl)
        ];

        let html = null;
        let lastError = null;

        for (const proxyUrl of proxyCandidates) {
            try {
                const response = await fetch(proxyUrl, {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("HTTP " + response.status);
                }

                if (proxyUrl.includes("allorigins.win")) {
                    const data = await response.json();

                    if (!data || !data.contents) {
                        throw new Error("Empty response from AllOrigins");
                    }

                    html = data.contents;
                } else {
                    html = await response.text();
                }

                if (html && html.length > 0) {
                    break;
                }
            } catch (err) {
                lastError = err;
            }
        }

        if (!html) {
            throw new Error(
                "Unable to retrieve search results. " +
                (lastError ? lastError.message : "Unknown error")
            );
        }

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, "text/html");

        let snippets = Array.from(
            doc.querySelectorAll(".result__snippet")
        );

        if (snippets.length === 0) {
            snippets = Array.from(
                doc.querySelectorAll("[class*='snippet']")
            );
        }

        const extracted = snippets
            .map(node => (node.textContent || "").trim())
            .filter(text => text.length > 20)
            .slice(0, MAX_RESULTS);

        if (extracted.length === 0) {
            throw new Error("No search snippets found");
        }

        return extracted.join(" | ");
    }

    window["ai_edge_gallery_get_result"] = async function (data) {
        try {
            const payload = JSON.parse(data || "{}");

            const query = String(payload.query || "").trim();

            if (!query) {
                throw new Error("Search query is empty");
            }

            const results = await fetchSearchResults(query);

            return JSON.stringify({
                result: results
            });

        } catch (error) {
            return JSON.stringify({
                error: error && error.message
                    ? error.message
                    : "Unknown error"
            });
        }
    };
})();
</script>

</body>
</html>
